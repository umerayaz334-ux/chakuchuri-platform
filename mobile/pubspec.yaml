name: chakuchuri_mobile
description: Customer mobile app for the ChakuChuri.pk exporter platform.
publish_to: "none"
version: 0.1.21+2018

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  flutter_webrtc: ^1.6.1
  flutter_local_notifications: ^19.4.2
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  file_picker: ^12.2.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.0.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
